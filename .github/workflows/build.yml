name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/gradle-build-action@v2
        with:
          file-based-hello-world-task: true
      - name: Build
        run: ./gradlew build
      - name: Keep the jar
        uses: actions/upload-artifact@v4
        with:
          name: craftlatro-jar
          path: build/libs/craftlatro-*.jar
          if-no-files-found: error
