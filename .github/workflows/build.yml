name=build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/gradle-build-action@v2
        with:
          file-based-hello-world-task: true
      - name: Build
        run: ./gradlew build
